label: "LUMINUSOS"
rootfs:
  size: 8192
grub2:
  timeout: 10
  entries:
    - name: "Luminus OS Live"
      linux: "/images/pxeboot/vmlinuz quiet rhgb splash loglevel=3 rd.udev.log-priority=3 vt.global_cursor_default=0 console=ttyS0,115200 root=live:CDLABEL=LUMINUSOS enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
