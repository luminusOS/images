[Slice]
# systemd-oomd-defaults only watches memory pressure. When swap is used up the
# pressure can stay low, and then the kernel OOM killer picks the victim, often
# a small process. With this, once swap and available memory are both nearly
# gone, oomd kills the application using the most swap.
# Only the applications: gnome-shell sits in session.slice and must not be a
# candidate, since killing it ends the session.
ManagedOOMSwap=kill
