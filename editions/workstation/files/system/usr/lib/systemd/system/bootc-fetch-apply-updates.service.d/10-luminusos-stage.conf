# Stage updates for the next boot instead of rebooting the desktop, and skip
# metered connections so a phone hotspot does not download a full image.
[Unit]
Description=Stage bootc updates for the next boot

[Service]
ExecCondition=/bin/sh -c '! nmcli -t -f GENERAL.METERED device show 2>/dev/null | grep -q ":yes"'
ExecStart=
ExecStart=/usr/bin/bootc upgrade --quiet
