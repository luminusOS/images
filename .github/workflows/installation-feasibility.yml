name: Installation feasibility

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Run whose workstation-iso artifact is installed (diagnostic only)
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  install:
    name: Sirius install on hosted KVM
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Download candidate ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workstation-iso
          path: dist
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM and vhost-vsock for the runner user
        run: |
          printf '%s\n' \
            'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            'KERNEL=="vhost-vsock", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-luminus-vm.rules
          sudo modprobe vhost_vsock
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm trigger --name-match=vhost-vsock
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf socat openssh-client
      - name: Install with Sirius and boot the installed disk
        run: |
          shopt -s nullglob
          isos=(dist/*.iso)
          test "${#isos[@]}" -eq 1
          sha256sum "${isos[0]}" | tee feasibility-iso.sha256
          python3 .github/scripts/workflow/install_feasibility.py "${isos[0]}" feasibility
          mv feasibility-iso.sha256 feasibility/
      - name: Upload feasibility evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installation-feasibility
          path: feasibility/
          if-no-files-found: warn
