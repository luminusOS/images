name: Auto Testing

# Daily check: detect Fedora base changes and validate a local candidate only.
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if the Fedora base digest is unchanged"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  check:
    name: Check Fedora base
    # Only main may sign and publish to the channel installed systems follow.
    needs: [quality]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare Fedora bootc digest with the latest testing image
        id: check
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

          fedora_version="$(python3 tools/config-value.py DEFAULT_FEDORA_VERSION)"
          latest="$(python3 tools/fedora-bootc-digest.py "${fedora_version}")"
          namespace="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="docker://ghcr.io/${namespace}/luminusos-workstation:testing-${fedora_version}"

          printf '%s' "${GHCR_TOKEN}" | skopeo login ghcr.io -u "${GHCR_USER}" --password-stdin

          # Only a missing tag means "never built"; any other registry error fails the job
          # instead of silently publishing again.
          current=""
          built=""
          if inspect="$(skopeo inspect --retry-times 3 "${image}" 2>err.txt)"; then
            current="$(jq -r '.Labels["org.opencontainers.image.base.digest"] // ""' <<<"${inspect}")"
            built="$(jq -r '.Labels["org.opencontainers.image.version"] // ""' <<<"${inspect}")"
          elif ! grep -qiE 'manifest unknown|name unknown|not found' err.txt; then
            cat err.txt >&2
            exit 1
          fi

          # A build whose release step failed has no git tag yet; retry it even if the digest matches.
          released=false
          if [ -n "${built}" ] && gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/testing-${built}" >/dev/null 2>&1; then
            released=true
          fi

          echo "Fedora ${fedora_version} base: live ${latest}, last built '${current}' (version '${built}', released=${released})"
          if [ "${FORCE}" = true ] || [ "${latest}" != "${current}" ] || [ "${released}" != true ]; then
            echo "build=true" >>"${GITHUB_OUTPUT}"
          else
            echo "build=false" >>"${GITHUB_OUTPUT}"
            echo "Fedora base unchanged and release exists; nothing to build."
          fi

  prepare:
    name: Prepare testing candidate
    needs: [check]
    if: needs.check.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      channel: testing
      build_sequence: true
      force_core: true
    secrets:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
