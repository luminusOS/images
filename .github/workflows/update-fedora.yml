name: Update Fedora bootc

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

concurrency:
  group: update-fedora-bootc
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Fedora bootc digest
        shell: bash
        run: |
          set -euo pipefail

          fedora_version="$(./tools/config-value.sh DEFAULT_FEDORA_VERSION)"
          current="$(./tools/config-value.sh FEDORA_BOOTC_DIGEST)"
          latest="$(./tools/fedora-bootc-digest.sh "${fedora_version}")"
          if [ "$latest" = "$current" ]; then
            echo "Fedora bootc $fedora_version is already current."
            exit 0
          fi

          sed -i "s/^FEDORA_BOOTC_DIGEST=.*/FEDORA_BOOTC_DIGEST=$latest/" config/versions.env
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/versions.env
          git commit -m "chore: update Fedora bootc $fedora_version base"
          git push origin HEAD:main

          gh workflow run build-containers.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
