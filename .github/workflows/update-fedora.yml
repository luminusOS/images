name: Update Fedora bootc

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

concurrency:
  group: update-fedora-bootc
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update Fedora bootc digest
        shell: bash
        run: |
          set -euo pipefail

          fedora_version="$(./tools/config-value.sh DEFAULT_FEDORA_VERSION)"
          current="$(./tools/config-value.sh FEDORA_BOOTC_DIGEST)"
          latest="$(curl --fail --silent --show-error --head \
            --header 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://quay.io/v2/fedora/fedora-bootc/manifests/${fedora_version}" |
            sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: *\([^[:space:]]*\).*/\1/p' |
            tr -d '\r')"

          [[ "$latest" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [ "$latest" = "$current" ]; then
            echo "Fedora bootc $fedora_version is already current."
            exit 0
          fi

          sed -i "s/^FEDORA_BOOTC_DIGEST=.*/FEDORA_BOOTC_DIGEST=$latest/" config/versions.env
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/versions.env
          git commit -m "chore: update Fedora bootc $fedora_version base"
          git push origin HEAD:main

          gh workflow run build-containers.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
