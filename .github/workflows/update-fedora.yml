name: Update Fedora Release

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

concurrency:
  group: update-fedora-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update Fedora version
        shell: bash
        run: |
          set -euo pipefail

          current="$(./tools/config-value.sh DEFAULT_FEDORA_VERSION)"
          latest="$(curl --fail --silent --show-error --location https://fedoraproject.org/releases.json |
            jq --raw-output '[.[].version | select(test("^[0-9]+$")) | tonumber] | max')"

          [[ "$latest" =~ ^[0-9]+$ ]]
          if ((latest <= current)); then
            echo "Fedora $current is already current."
            exit 0
          fi

          sed -i "s/^DEFAULT_FEDORA_VERSION=.*/DEFAULT_FEDORA_VERSION=$latest/" config/versions.env
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/versions.env
          git commit -m "chore: update images to Fedora $latest"
          git push origin HEAD:main

          gh workflow run build-containers.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
