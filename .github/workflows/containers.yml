name: Image Build Orchestration

on:
  workflow_call:
    inputs:
      fedora_version: {type: string, default: ""}
      channel: {type: string, default: testing}
      promote_version: {type: string, default: ""}
      workstation_digest: {type: string, default: ""}
      sirius_version: {type: string, default: ""}
      sirius_sha256: {type: string, default: ""}
      skip_flatpaks: {type: string, default: "0"}
      build_installer: {type: boolean, default: false}
      publish: {type: boolean, default: false}
      builder_mode: {type: string, default: local}
      build_sequence: {type: boolean, default: false}
      candidate_id: {type: string, default: ""}
      core_ref: {type: string, default: ""}
      force_core: {type: boolean, default: false}
    outputs:
      fedora_version: {value: '${{ jobs.metadata.outputs.fedora_version }}'}
      fedora_bootc_digest: {value: '${{ jobs.metadata.outputs.fedora_bootc_digest }}'}
      version_tag: {value: '${{ jobs.metadata.outputs.version_tag }}'}
      build_version: {value: '${{ jobs.metadata.outputs.build_version }}'}
      branch_tag: {value: '${{ jobs.metadata.outputs.branch_tag }}'}
      channel_tag: {value: '${{ jobs.metadata.outputs.channel_tag }}'}
      image_namespace: {value: '${{ jobs.metadata.outputs.image_namespace }}'}
      release_tag: {value: '${{ jobs.metadata.outputs.release_tag }}'}
      core_image: {value: '${{ jobs.metadata.outputs.core_image }}'}
      workstation_image: {value: '${{ jobs.metadata.outputs.workstation_image }}'}
      workstation_iso_image: {value: '${{ jobs.metadata.outputs.workstation_iso_image }}'}
      core_digest: {value: '${{ jobs.core.outputs.digest }}'}
      core_built_oci_manifest_digest: {value: '${{ jobs.core.outputs.built_oci_manifest_digest }}'}
      core_built_oci_skopeo_version: {value: '${{ jobs.core.outputs.built_oci_skopeo_version }}'}
      core_built_oci_artifact_id: {value: '${{ jobs.core.outputs.built_oci_artifact_id }}'}
      workstation_built_oci_manifest_digest: {value: '${{ jobs.workstation.outputs.built_oci_manifest_digest }}'}
      workstation_built_oci_skopeo_version: {value: '${{ jobs.workstation.outputs.built_oci_skopeo_version }}'}
      workstation_built_oci_artifact_id: {value: '${{ jobs.workstation.outputs.built_oci_artifact_id }}'}
      installer_built_oci_manifest_digest: {value: '${{ jobs.installer.outputs.built_oci_manifest_digest }}'}
      installer_built_oci_skopeo_version: {value: '${{ jobs.installer.outputs.built_oci_skopeo_version }}'}
      installer_built_oci_artifact_id: {value: '${{ jobs.installer.outputs.built_oci_artifact_id }}'}
      core_image_id: {value: '${{ jobs.core.outputs.image_id }}'}
      workstation_image_id: {value: '${{ jobs.workstation.outputs.image_id }}'}
      installer_image_id: {value: '${{ jobs.installer.outputs.image_id }}'}
      core_fingerprint: {value: '${{ jobs.core.outputs.fingerprint }}'}
      core_archive_sha256: {value: '${{ jobs.core.outputs.archive_sha256 }}'}
      workstation_archive_sha256: {value: '${{ jobs.workstation.outputs.archive_sha256 }}'}
      installer_archive_sha256: {value: '${{ jobs.installer.outputs.archive_sha256 }}'}
      workstation_core_image_id: {value: '${{ jobs.workstation.outputs.core_image_id }}'}
      workstation_core_digest: {value: '${{ jobs.workstation.outputs.core_digest }}'}

jobs:
  metadata:
    name: Resolve build metadata
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      fedora_version: '${{ steps.version.outputs.fedora_version }}'
      fedora_bootc_digest: '${{ steps.version.outputs.fedora_bootc_digest }}'
      version_tag: '${{ steps.version.outputs.version_tag }}'
      build_version: '${{ steps.version.outputs.build_version }}'
      release_tag: '${{ steps.version.outputs.release_tag }}'
      branch_tag: '${{ steps.version.outputs.branch_tag }}'
      channel_tag: '${{ steps.version.outputs.channel_tag }}'
      image_namespace: '${{ steps.version.outputs.image_namespace }}'
      target_tag: '${{ steps.version.outputs.target_tag }}'
      core_image: '${{ steps.version.outputs.core_image }}'
      workstation_image: '${{ steps.version.outputs.workstation_image }}'
      workstation_iso_image: '${{ steps.version.outputs.workstation_iso_image }}'
      sirius_version: '${{ steps.version.outputs.sirius_version }}'
      sirius_rpm_version: '${{ steps.version.outputs.sirius_rpm_version }}'
      sirius_sha256: '${{ steps.version.outputs.sirius_sha256 }}'
      aurora_shell_version: '${{ steps.version.outputs.aurora_shell_version }}'
      aurora_shell_sha256: '${{ steps.version.outputs.aurora_shell_sha256 }}'
      elastic_swap_version: '${{ steps.version.outputs.elastic_swap_version }}'
      elastic_swap_sha256: '${{ steps.version.outputs.elastic_swap_sha256 }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve versions and image references
        id: version
        env:
          FEDORA_VERSION: '${{ inputs.fedora_version }}'
          CHANNEL: '${{ inputs.channel }}'
          PROMOTE_VERSION: '${{ inputs.promote_version }}'
          SIRIUS_VERSION: '${{ inputs.sirius_version }}'
          SIRIUS_SHA256: '${{ inputs.sirius_sha256 }}'
          BUILDER_MODE: '${{ inputs.builder_mode }}'
          PUBLISH: '${{ inputs.publish }}'
          BUILD_SEQUENCE: '${{ inputs.build_sequence }}'
          CANDIDATE_ID: '${{ inputs.candidate_id }}'
        run: python3 .github/scripts/workflow/build_metadata.py

  core:
    name: Build core image
    if: inputs.channel != 'stable'
    needs: [metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: {contents: read, packages: read}
    outputs:
      digest: '${{ steps.select.outputs.digest }}'
      reused: '${{ steps.select.outputs.reused }}'
      image_id: '${{ steps.save.outputs.image_id }}'
      archive_sha256: '${{ steps.save.outputs.archive_sha256 }}'
      fingerprint: '${{ steps.hash.outputs.fingerprint }}'
      built_oci_manifest_digest: '${{ steps.upload-core-oci.outcome == ''success'' && steps.export-core-oci.outputs.manifest_digest || '''' }}'
      built_oci_skopeo_version: '${{ steps.upload-core-oci.outcome == ''success'' && steps.export-core-oci.outputs.skopeo_version || '''' }}'
      built_oci_artifact_id: '${{ steps.upload-core-oci.outcome == ''success'' && steps.upload-core-oci.outputs.artifact-id || '''' }}'
    steps:
      - uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4.7.0
        with:
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hash core inputs
        id: hash
        env:
          FEDORA_VERSION: '${{ needs.metadata.outputs.fedora_version }}'
          BASE_DIGEST: '${{ needs.metadata.outputs.fedora_bootc_digest }}'
        run: python3 .github/scripts/workflow/core_reuse.py hash
      - name: Install core image tools
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        if: inputs.core_ref != '' && !inputs.force_core && github.event_name != 'schedule'
        with: {cosign-release: v2.5.3}
      - name: Select verified core
        id: select
        env:
          CORE_REF: '${{ inputs.core_ref }}'
          FEDORA_VERSION: '${{ needs.metadata.outputs.fedora_version }}'
          FINGERPRINT: '${{ steps.hash.outputs.fingerprint }}'
          IMAGE: '${{ needs.metadata.outputs.core_image }}'
          FORCE_REBUILD: '${{ inputs.force_core || github.event_name == ''schedule'' }}'
        run: python3 .github/scripts/workflow/core_reuse.py select
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.select.outputs.reused != 'true'
        with: {driver: docker}
      - name: Build core
        id: build
        if: steps.select.outputs.reused != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: editions/core/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          no-cache: '${{ inputs.force_core || github.event_name == ''schedule'' }}'
          cache-from: type=gha,scope=core-${{ needs.metadata.outputs.fedora_version }}-${{ runner.arch }}
          cache-to: type=gha,scope=core-${{ needs.metadata.outputs.fedora_version }}-${{ runner.arch }},mode=max
          build-args: |
            base=quay.io/fedora/fedora-bootc:${{ needs.metadata.outputs.fedora_version }}@${{ needs.metadata.outputs.fedora_bootc_digest }}
            fedora_version=${{ needs.metadata.outputs.fedora_version }}
            distro_version=${{ needs.metadata.outputs.build_version }}
            distro_name=LuminusOS
            distro_pretty_name=Luminus OS
          labels: |
            org.luminusos.core.fedora=${{ needs.metadata.outputs.fedora_version }}
            org.luminusos.core.inputs-sha256=${{ steps.hash.outputs.fingerprint }}
          tags: '${{ needs.metadata.outputs.core_image }}'
      - name: Export built core OCI layout
        id: export-core-oci
        if: inputs.channel == 'testing' && steps.select.outputs.reused != 'true' && steps.build.outcome == 'success'
        env:
          IMAGE: '${{ needs.metadata.outputs.core_image }}'
        run: python3 .github/scripts/workflow/oci_layout.py export --image "$IMAGE" --layout core-oci --ref core --docker-host "${DOCKER_HOST:?Docker setup did not expose its socket}"
      - name: Upload built core OCI layout
        id: upload-core-oci
        if: steps.export-core-oci.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: core-oci, path: core-oci/, compression-level: 0, if-no-files-found: error}
      - name: Save core image archive
        id: save
        env:
          IMAGE: '${{ needs.metadata.outputs.core_image }}'
          ARCHIVE: core-image.tar
        run: python3 .github/scripts/workflow/image_archive.py save
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: core-image, path: core-image.tar, compression-level: 0, if-no-files-found: error}

  workstation:
    name: Build workstation image
    if: inputs.channel != 'stable'
    needs: [metadata, core]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read, packages: read, actions: read}
    outputs:
      image_id: '${{ steps.save.outputs.image_id }}'
      archive_sha256: '${{ steps.save.outputs.archive_sha256 }}'
      core_image_id: '${{ needs.core.outputs.image_id }}'
      core_digest: '${{ needs.core.outputs.digest }}'
      built_oci_manifest_digest: '${{ steps.upload-workstation-oci.outcome == ''success'' && steps.export-workstation-oci.outputs.manifest_digest || '''' }}'
      built_oci_skopeo_version: '${{ steps.upload-workstation-oci.outcome == ''success'' && steps.export-workstation-oci.outputs.skopeo_version || '''' }}'
      built_oci_artifact_id: '${{ steps.upload-workstation-oci.outcome == ''success'' && steps.upload-workstation-oci.outputs.artifact-id || '''' }}'
    steps:
      - uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4.7.0
        with:
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch verified canonical core OCI layout
        id: fetch-core-oci
        if: inputs.channel == 'testing' && needs.core.outputs.reused != 'true'
        env:
          GH_TOKEN: '${{ github.token }}'
          EXPECTED_DIGEST: '${{ needs.core.outputs.built_oci_manifest_digest }}'
        run: python3 .github/scripts/workflow/oci_layout.py fetch-core --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --layout "$RUNNER_TEMP/core-oci" --expected-digest "$EXPECTED_DIGEST"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.channel != 'testing' || needs.core.outputs.reused == 'true'
        with: {name: core-image}
      - name: Load core image
        if: inputs.channel != 'testing' || needs.core.outputs.reused == 'true'
        env:
          IMAGE: '${{ needs.metadata.outputs.core_image }}'
          ARCHIVE: core-image.tar
          ARCHIVE_SHA256: '${{ needs.core.outputs.archive_sha256 }}'
          IMAGE_ID: '${{ needs.core.outputs.image_id }}'
        run: python3 .github/scripts/workflow/image_archive.py load
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with: {driver: docker}
      - name: Build workstation
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: editions/workstation/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          no-cache: '${{ inputs.force_core || github.event_name == ''schedule'' }}'
          cache-from: type=gha,scope=workstation-${{ needs.metadata.outputs.fedora_version }}-${{ runner.arch }}
          cache-to: type=gha,scope=workstation-${{ needs.metadata.outputs.fedora_version }}-${{ runner.arch }},mode=max
          build-contexts: '${{ inputs.channel == ''testing'' && needs.core.outputs.reused != ''true'' && format(''luminusos-core-context.invalid/core=oci-layout://{0}/core-oci@{1}'', runner.temp, needs.core.outputs.built_oci_manifest_digest) || '''' }}'
          build-args: |
            core_image=${{ inputs.channel == 'testing' && needs.core.outputs.reused != 'true' && 'luminusos-core-context.invalid/core' || needs.metadata.outputs.core_image }}
            fedora_bootc_base=quay.io/fedora/fedora-bootc:${{ needs.metadata.outputs.fedora_version }}@${{ needs.metadata.outputs.fedora_bootc_digest }}
            fedora_version=${{ needs.metadata.outputs.fedora_version }}
            fedora_bootc_digest=${{ needs.metadata.outputs.fedora_bootc_digest }}
            image_version=${{ needs.metadata.outputs.build_version }}
            edition_name=Workstation
            edition_id=workstation
            skip_flatpaks=${{ inputs.skip_flatpaks }}
            aurora_shell_version=${{ needs.metadata.outputs.aurora_shell_version }}
            aurora_shell_sha256=${{ needs.metadata.outputs.aurora_shell_sha256 }}
            elastic_swap_version=${{ needs.metadata.outputs.elastic_swap_version }}
            elastic_swap_sha256=${{ needs.metadata.outputs.elastic_swap_sha256 }}
          tags: '${{ needs.metadata.outputs.workstation_image }}'
      - name: Install workstation OCI export tools
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Export built workstation OCI layout
        id: export-workstation-oci
        if: inputs.channel == 'testing' && steps.build.outcome == 'success'
        env:
          IMAGE: '${{ needs.metadata.outputs.workstation_image }}'
        run: python3 .github/scripts/workflow/oci_layout.py export --image "$IMAGE" --layout workstation-oci --ref workstation --docker-host "${DOCKER_HOST:?Docker setup did not expose its socket}"
      - name: Verify declared core ancestry
        id: check-core-ancestry
        if: inputs.channel == 'testing' && needs.core.outputs.reused != 'true' && steps.export-workstation-oci.outcome == 'success'
        env:
          CORE_DIGEST: '${{ needs.core.outputs.built_oci_manifest_digest }}'
          WORKSTATION_DIGEST: '${{ steps.export-workstation-oci.outputs.manifest_digest }}'
        run: python3 .github/scripts/workflow/oci_layout.py ancestry --core-layout "$RUNNER_TEMP/core-oci" --layout workstation-oci --core-digest "$CORE_DIGEST" --expected-digest "$WORKSTATION_DIGEST"
      - name: Upload built workstation OCI layout
        id: upload-workstation-oci
        if: success() && steps.export-workstation-oci.outcome == 'success' && (needs.core.outputs.reused == 'true' || steps.check-core-ancestry.outcome == 'success')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: workstation-oci, path: workstation-oci/, compression-level: 0, if-no-files-found: error}
      - name: Save workstation image archive
        id: save
        env:
          IMAGE: '${{ needs.metadata.outputs.workstation_image }}'
          ARCHIVE: workstation-image.tar
        run: python3 .github/scripts/workflow/image_archive.py save
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: workstation-image, path: workstation-image.tar, compression-level: 0, if-no-files-found: error}

  installer:
    name: Build installer image
    if: always() && inputs.build_installer && needs.metadata.result == 'success' && (inputs.channel == 'stable' || needs.workstation.result == 'success')
    needs: [metadata, workstation]
    permissions: {contents: read, packages: read, actions: read}
    uses: ./.github/workflows/installer.yml
    with:
      channel: ${{ inputs.channel }}
      fedora_version: ${{ needs.metadata.outputs.fedora_version }}
      sirius_version: ${{ needs.metadata.outputs.sirius_version }}
      sirius_rpm_version: ${{ needs.metadata.outputs.sirius_rpm_version }}
      sirius_sha256: ${{ needs.metadata.outputs.sirius_sha256 }}
      build_version: ${{ needs.metadata.outputs.build_version }}
      workstation_image: ${{ needs.metadata.outputs.workstation_image }}
      image_namespace: ${{ needs.metadata.outputs.image_namespace }}
      target_tag: ${{ needs.metadata.outputs.target_tag }}
      workstation_iso_image: ${{ needs.metadata.outputs.workstation_iso_image }}
      workstation_digest: ${{ inputs.workstation_digest }}
      workstation_archive_sha256: ${{ needs.workstation.outputs.archive_sha256 }}
      workstation_image_id: ${{ needs.workstation.outputs.image_id }}
