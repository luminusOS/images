name: Reusable Container Build

on:
  workflow_call:
    inputs:
      fedora_version:
        required: false
        type: string
        default: ""
      channel:
        required: false
        type: string
        default: testing
      promote_version:
        required: false
        type: string
        default: ""
      sirius_version:
        required: false
        type: string
        default: ""
      sirius_sha256:
        required: false
        type: string
        default: ""
      skip_flatpaks:
        required: false
        type: string
        default: "0"
      build_installer:
        required: false
        type: boolean
        default: false
      publish:
        required: false
        type: boolean
        default: false
      channel_policy:
        required: false
        type: string
        default: auto
      builder_mode:
        required: false
        type: string
        default: registry
    outputs:
      fedora_version:
        value: ${{ jobs.build.outputs.fedora_version }}
      fedora_bootc_digest:
        value: ${{ jobs.build.outputs.fedora_bootc_digest }}
      version_tag:
        value: ${{ jobs.build.outputs.version_tag }}
      build_version:
        value: ${{ jobs.build.outputs.build_version }}
      branch_tag:
        value: ${{ jobs.build.outputs.branch_tag }}
      channel_tag:
        value: ${{ jobs.build.outputs.channel_tag }}
      image_namespace:
        value: ${{ jobs.build.outputs.image_namespace }}
      release_tag:
        value: ${{ jobs.build.outputs.release_tag }}
      core_image:
        value: ${{ jobs.build.outputs.core_image }}
      workstation_image:
        value: ${{ jobs.build.outputs.workstation_image }}
      workstation_iso_image:
        value: ${{ jobs.build.outputs.workstation_iso_image }}

jobs:
  build:
    name: Build core and workstation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      fedora_version: ${{ steps.version.outputs.fedora_version }}
      fedora_bootc_digest: ${{ steps.version.outputs.fedora_bootc_digest }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      build_version: ${{ steps.version.outputs.build_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      branch_tag: ${{ steps.version.outputs.branch_tag }}
      channel_tag: ${{ steps.version.outputs.channel_tag }}
      image_namespace: ${{ steps.version.outputs.image_namespace }}
      core_image: ${{ steps.version.outputs.core_image }}
      workstation_image: ${{ steps.version.outputs.workstation_image }}
      workstation_iso_image: ${{ steps.version.outputs.workstation_iso_image }}
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve versions and image references
        id: version
        shell: bash
        env:
          INPUT_FEDORA_VERSION: ${{ inputs.fedora_version }}
          CHANNEL: ${{ inputs.channel }}
          INPUT_PROMOTE_VERSION: ${{ inputs.promote_version }}
          INPUT_SIRIUS_VERSION: ${{ inputs.sirius_version }}
          INPUT_SIRIUS_SHA256: ${{ inputs.sirius_sha256 }}
          CHANNEL_POLICY: ${{ inputs.channel_policy }}
          BUILDER_MODE: ${{ inputs.builder_mode }}
        run: |
          set -euo pipefail
          source config/versions.env

          case "${BUILDER_MODE}" in local|registry) ;; *) echo "Unknown builder_mode: ${BUILDER_MODE}" >&2; exit 1 ;; esac
          case "${CHANNEL_POLICY}" in auto|always|never) ;; *) echo "Unknown channel_policy: ${CHANNEL_POLICY}" >&2; exit 1 ;; esac
          case "${CHANNEL}" in testing|stable) ;; *) echo "Unknown channel: ${CHANNEL}" >&2; exit 1 ;; esac
          case "${UPDATE_CHANNEL}" in testing|stable) ;; *) echo "Unknown UPDATE_CHANNEL: ${UPDATE_CHANNEL}" >&2; exit 1 ;; esac
          if [ "${BUILDER_MODE}" = registry ] && [ "${{ inputs.publish }}" != true ]; then
            echo "registry mode requires publish=true so downstream images can pull their base" >&2
            exit 1
          fi
          if [ "${BUILDER_MODE}" = local ] && [ "${{ inputs.build_installer }}" = true ]; then
            echo "installer builds require builder_mode=registry" >&2
            exit 1
          fi

          if [ "${CHANNEL}" = stable ]; then
            if ! [[ "${INPUT_PROMOTE_VERSION}" =~ ^([0-9]+)\.[0-9]{8}$ ]]; then
              echo "stable requires promote_version like 45.20260923 (an existing testing-<version> build)" >&2
              exit 1
            fi
            if [ "${BUILDER_MODE}" != registry ]; then
              echo "stable promotion requires builder_mode=registry" >&2
              exit 1
            fi
            fedora_version="${BASH_REMATCH[1]}"
            build_version="${INPUT_PROMOTE_VERSION}"
            version_tag="${build_version}"
            branch_tag="${fedora_version}"
            channel_tag=latest
            release_tag="v${build_version}"
          else
            if [ -n "${INPUT_FEDORA_VERSION}" ]; then
              fedora_version="${INPUT_FEDORA_VERSION}"
            elif [[ "${GITHUB_REF_NAME}" =~ ^f([0-9]+)$ ]]; then
              fedora_version="${BASH_REMATCH[1]}"
            else
              fedora_version="${DEFAULT_FEDORA_VERSION}"
            fi
            build_version="${fedora_version}.$(date -u +%Y%m%d)"
            version_tag="testing-${build_version}"
            branch_tag="testing-${fedora_version}"
            channel_tag=testing
            release_tag="${version_tag}"
          fi
          fedora_bootc_digest=""
          if [ "${CHANNEL}" != stable ]; then
            fedora_bootc_digest="$(tools/fedora-bootc-digest.sh "${fedora_version}")"
          fi
          if [ "${UPDATE_CHANNEL}" = stable ]; then
            target_tag="${fedora_version}"
          else
            target_tag="testing-${fedora_version}"
          fi
          image_namespace="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [ -n "${INPUT_SIRIUS_VERSION}" ]; then
            if ! [[ "${INPUT_SIRIUS_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "sirius_version override requires sirius_sha256 of the release RPM" >&2
              exit 1
            fi
            sirius_version="${INPUT_SIRIUS_VERSION}"
            sirius_rpm_version="${INPUT_SIRIUS_VERSION}"
            sirius_sha256="${INPUT_SIRIUS_SHA256}"
          else
            sirius_version="${SIRIUS_VERSION}"
            sirius_rpm_version="${SIRIUS_RPM_VERSION}"
            sirius_sha256="${SIRIUS_SHA256}"
          fi

          publish_channel=false
          case "${CHANNEL_POLICY}" in
            always) publish_channel=true ;;
            never) ;;
            auto)
              if [ "${GITHUB_REF_NAME}" = "f${DEFAULT_FEDORA_VERSION}" ] || [ "${GITHUB_REF_NAME}" = main ]; then
                publish_channel=true
              fi
              ;;
          esac
          if [ "${CHANNEL}" = stable ]; then
            publish_channel=true
          fi

          core_image="${REGISTRY}/${image_namespace}/luminusos:${version_tag}"
          workstation_image="${REGISTRY}/${image_namespace}/luminusos-workstation:${version_tag}"
          workstation_iso_image="${workstation_image}-iso"
          channel_core_image="${core_image}"
          channel_workstation_image="${workstation_image}"
          if [ "${publish_channel}" = true ]; then
            channel_core_image="${REGISTRY}/${image_namespace}/luminusos:${channel_tag}"
            channel_workstation_image="${REGISTRY}/${image_namespace}/luminusos-workstation:${channel_tag}"
          fi
          core_build_ref="${core_image}"
          local_core_tag="${core_image}"
          local_workstation_tag="${workstation_image}"
          if [ "${BUILDER_MODE}" = local ]; then
            core_build_ref="localhost/luminusos:${version_tag}"
            local_core_tag="${core_build_ref}"
            local_workstation_tag="localhost/luminusos-workstation:${version_tag}"
          fi

          {
            echo "fedora_version=${fedora_version}"
            echo "fedora_bootc_digest=${fedora_bootc_digest}"
            echo "build_version=${build_version}"
            echo "version_tag=${version_tag}"
            echo "release_tag=${release_tag}"
            echo "target_tag=${target_tag}"
            echo "branch_tag=${branch_tag}"
            echo "channel_tag=${channel_tag}"
            echo "image_namespace=${image_namespace}"
            echo "sirius_version=${sirius_version}"
            echo "sirius_rpm_version=${sirius_rpm_version}"
            echo "sirius_sha256=${sirius_sha256}"
            echo "aurora_shell_version=${AURORA_SHELL_VERSION}"
            echo "aurora_shell_sha256=${AURORA_SHELL_SHA256}"
            echo "publish_channel=${publish_channel}"
            echo "core_image=${core_image}"
            echo "workstation_image=${workstation_image}"
            echo "workstation_iso_image=${workstation_iso_image}"
            echo "channel_core_image=${channel_core_image}"
            echo "channel_workstation_image=${channel_workstation_image}"
            echo "core_build_ref=${core_build_ref}"
            echo "local_core_tag=${local_core_tag}"
            echo "local_workstation_tag=${local_workstation_tag}"
          } >>"${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ inputs.builder_mode == 'local' && 'docker' || 'docker-container' }}

      - name: Build core
        if: inputs.channel != 'stable'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: editions/core/Containerfile
          load: ${{ inputs.builder_mode == 'local' }}
          push: ${{ inputs.builder_mode == 'registry' && inputs.publish }}
          build-args: |
            base=quay.io/fedora/fedora-bootc:${{ steps.version.outputs.fedora_version }}@${{ steps.version.outputs.fedora_bootc_digest }}
            fedora_version=${{ steps.version.outputs.fedora_version }}
            distro_version=${{ steps.version.outputs.build_version }}
            distro_name=LuminusOS
            distro_pretty_name=Luminus OS
          tags: |
            ${{ steps.version.outputs.local_core_tag }}
            ${{ steps.version.outputs.core_image }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.image_namespace }}/luminusos:${{ steps.version.outputs.branch_tag }}
            ${{ steps.version.outputs.channel_core_image }}
          cache-from: ${{ inputs.builder_mode == 'registry' && 'type=gha' || '' }}
          cache-to: ${{ inputs.builder_mode == 'registry' && 'type=gha,mode=max' || '' }}

      - name: Publish core from local builder
        if: inputs.publish && inputs.builder_mode == 'local' && inputs.channel != 'stable'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.version.outputs.core_image }}"
          docker push "${REGISTRY}/${{ steps.version.outputs.image_namespace }}/luminusos:${{ steps.version.outputs.branch_tag }}"
          if [ "${{ steps.version.outputs.publish_channel }}" = true ]; then
            docker push "${REGISTRY}/${{ steps.version.outputs.image_namespace }}/luminusos:${{ steps.version.outputs.channel_tag }}"
          fi

      - name: Build workstation
        if: inputs.channel != 'stable'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: editions/workstation/Containerfile
          load: ${{ inputs.builder_mode == 'local' }}
          push: ${{ inputs.builder_mode == 'registry' && inputs.publish }}
          build-args: |
            core_image=${{ steps.version.outputs.core_build_ref }}
            fedora_bootc_base=quay.io/fedora/fedora-bootc:${{ steps.version.outputs.fedora_version }}@${{ steps.version.outputs.fedora_bootc_digest }}
            fedora_version=${{ steps.version.outputs.fedora_version }}
            image_version=${{ steps.version.outputs.build_version }}
            edition_name=Workstation
            edition_id=workstation
            skip_flatpaks=${{ inputs.skip_flatpaks }}
            aurora_shell_version=${{ steps.version.outputs.aurora_shell_version }}
            aurora_shell_sha256=${{ steps.version.outputs.aurora_shell_sha256 }}
          tags: |
            ${{ steps.version.outputs.local_workstation_tag }}
            ${{ steps.version.outputs.workstation_image }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.image_namespace }}/luminusos-workstation:${{ steps.version.outputs.branch_tag }}
            ${{ steps.version.outputs.channel_workstation_image }}
          cache-from: ${{ inputs.builder_mode == 'registry' && 'type=gha' || '' }}
          cache-to: ${{ inputs.builder_mode == 'registry' && 'type=gha,mode=max' || '' }}

      - name: Publish workstation from local builder
        if: inputs.publish && inputs.builder_mode == 'local' && inputs.channel != 'stable'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.version.outputs.workstation_image }}"
          docker push "${REGISTRY}/${{ steps.version.outputs.image_namespace }}/luminusos-workstation:${{ steps.version.outputs.branch_tag }}"
          if [ "${{ steps.version.outputs.publish_channel }}" = true ]; then
            docker push "${REGISTRY}/${{ steps.version.outputs.image_namespace }}/luminusos-workstation:${{ steps.version.outputs.channel_tag }}"
          fi

      - name: Install cosign
        if: inputs.publish && inputs.channel != 'stable'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # ponytail: cosign 3's default bundle format is unreadable by containers/image (bootc).
          cosign-release: v2.6.5

      - name: Sign core and workstation
        if: inputs.publish && inputs.channel != 'stable'
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          CORE_IMAGE: ${{ steps.version.outputs.core_image }}
          WORKSTATION_IMAGE: ${{ steps.version.outputs.workstation_image }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
            echo "COSIGN_PRIVATE_KEY is not set; refusing to publish unsigned images" >&2
            exit 1
          fi
          for image in "${CORE_IMAGE}" "${WORKSTATION_IMAGE}"; do
            digest="$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}')"
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${image%:*}@${digest}"
          done

      - name: Install skopeo
        if: inputs.build_installer || inputs.channel == 'stable'
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Promote testing build to stable
        if: inputs.channel == 'stable'
        shell: bash
        env:
          NAMESPACE: ${{ steps.version.outputs.image_namespace }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          BRANCH_TAG: ${{ steps.version.outputs.branch_tag }}
          CHANNEL_TAG: ${{ steps.version.outputs.channel_tag }}
        run: |
          set -euo pipefail
          for repo in luminusos luminusos-workstation; do
            src="docker://${REGISTRY}/${NAMESPACE}/${repo}:testing-${BUILD_VERSION}"
            for tag in "${VERSION_TAG}" "${BRANCH_TAG}" "${CHANNEL_TAG}"; do
              skopeo copy --all --preserve-digests "${src}" "docker://${REGISTRY}/${NAMESPACE}/${repo}:${tag}"
            done
          done

      - name: Export installer payload as OCI layout
        if: inputs.build_installer
        run: |
          mkdir -p .test
          skopeo copy \
            "docker://${{ steps.version.outputs.workstation_image }}" \
            "oci:.test/payload.oci:latest"

      - name: Build workstation ISO live root
        if: inputs.build_installer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: editions/workstation/Containerfile.installer
          push: ${{ inputs.publish }}
          build-args: |
            fedora_version=${{ steps.version.outputs.fedora_version }}
            sirius_version=${{ steps.version.outputs.sirius_version }}
            sirius_rpm_version=${{ steps.version.outputs.sirius_rpm_version }}
            sirius_sha256=${{ steps.version.outputs.sirius_sha256 }}
            image_version=${{ steps.version.outputs.build_version }}
            workstation_image=${{ steps.version.outputs.workstation_image }}
            workstation_target_image=${{ env.REGISTRY }}/${{ steps.version.outputs.image_namespace }}/luminusos-workstation:${{ steps.version.outputs.target_tag }}
          tags: ${{ steps.version.outputs.workstation_iso_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
