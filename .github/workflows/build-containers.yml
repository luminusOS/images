name: Build Testing Containers

on:
  push:
    branches: ["main", "f*"]
  pull_request:
    branches: ["main", "f*"]
  workflow_dispatch:
    inputs:
      fedora_version:
        description: "Fedora version to build"
        required: false
        default: ""

concurrency:
  group: build-containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-containers:
    name: Build core and workstation
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/containers.yml
    with:
      fedora_version: ${{ inputs.fedora_version || '' }}
      builder_mode: local
      publish: ${{ github.event_name != 'pull_request' }}
      channel_policy: auto
    secrets: inherit
