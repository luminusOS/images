name: Build Containers

on:
  push:
    branches: ["main", "f*"]
  pull_request:
    branches: ["main", "f*"]
  workflow_dispatch:
    inputs:
      fedora_version:
        description: "Fedora version to build"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  DEFAULT_FEDORA_VERSION: "44"
  PRIMARY_FEDORA_BRANCH: f44
  AURORA_SHELL_VERSION: v50.3
  AURORA_SHELL_SHA256: 0fcfa7933872184831a80da6521d8535cf4dc1e2f367a45643332cfe7eba111f

jobs:
  build-containers:
    name: Build core and workstation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Resolve Fedora version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.fedora_version }}" ]; then
            FEDORA_VERSION="${{ inputs.fedora_version }}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^f([0-9]+)$ ]]; then
            FEDORA_VERSION="${BASH_REMATCH[1]}"
          else
            FEDORA_VERSION="${DEFAULT_FEDORA_VERSION}"
          fi

          VERSION_TAG="${FEDORA_VERSION}.$(date -u +%Y%m%d)"
          BRANCH_TAG="${FEDORA_VERSION}"
          IMAGE_NAMESPACE="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [ "${GITHUB_REF_NAME}" = "${PRIMARY_FEDORA_BRANCH}" ] || [ "${GITHUB_REF_NAME}" = "main" ]; then
            PUBLISH_LATEST=true
          else
            PUBLISH_LATEST=false
          fi

          {
            echo "fedora_version=${FEDORA_VERSION}"
            echo "version_tag=${VERSION_TAG}"
            echo "branch_tag=${BRANCH_TAG}"
            echo "image_namespace=${IMAGE_NAMESPACE}"
            echo "publish_latest=${PUBLISH_LATEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The docker driver keeps built images in the daemon's store, which is
      # what lets the workstation build resolve its localhost/ core base —
      # the default container driver cannot see daemon images and fails on
      # FROM localhost/... (GHA cache is not supported by this driver, so
      # no cache-from/to here).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build core locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: editions/core/Containerfile
          load: true
          build-args: |
            base=quay.io/fedora/fedora-bootc:${{ steps.version.outputs.fedora_version }}
            fedora_version=${{ steps.version.outputs.fedora_version }}
            distro_version=${{ steps.version.outputs.version_tag }}
            distro_name=LuminusOS
            distro_pretty_name=Luminus OS
          tags: |
            localhost/luminusos:${{ steps.version.outputs.version_tag }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.image_namespace }}/luminusos:${{ steps.version.outputs.version_tag }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.image_namespace }}/luminusos:${{ steps.version.outputs.branch_tag }}

      - name: Publish core
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${REGISTRY}/${{ steps.version.outputs.image_namespace }}/luminusos:${{ steps.version.outputs.version_tag }}"
          docker push "${REGISTRY}/${{ steps.version.outputs.image_namespace }}/luminusos:${{ steps.version.outputs.branch_tag }}"
          if [ "${{ steps.version.outputs.publish_latest }}" = "true" ]; then
            docker tag \
              "${REGISTRY}/${{ steps.version.outputs.image_namespace }}/luminusos:${{ steps.version.outputs.version_tag }}" \
              "${REGISTRY}/${{ steps.version.outputs.image_namespace }}/luminusos:latest"
            docker push "${REGISTRY}/${{ steps.version.outputs.image_namespace }}/luminusos:latest"
          fi

      - name: Build workstation locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: editions/workstation/Containerfile
          load: true
          build-args: |
            core_image=localhost/luminusos:${{ steps.version.outputs.version_tag }}
            fedora_version=${{ steps.version.outputs.fedora_version }}
            image_version=${{ steps.version.outputs.version_tag }}
            edition_name=Workstation
            edition_id=workstation
            workstation_image=${{ env.REGISTRY }}/${{ steps.version.outputs.image_namespace }}/luminusos-workstation:${{ steps.version.outputs.version_tag }}
            workstation_target_image=${{ env.REGISTRY }}/${{ steps.version.outputs.image_namespace }}/luminusos-workstation:${{ steps.version.outputs.branch_tag }}
            aurora_shell_version=${{ env.AURORA_SHELL_VERSION }}
            aurora_shell_sha256=${{ env.AURORA_SHELL_SHA256 }}
          tags: |
            localhost/luminusos-workstation:${{ steps.version.outputs.version_tag }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.image_namespace }}/luminusos-workstation:${{ steps.version.outputs.version_tag }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.image_namespace }}/luminusos-workstation:${{ steps.version.outputs.branch_tag }}

      - name: Publish workstation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${REGISTRY}/${{ steps.version.outputs.image_namespace }}/luminusos-workstation:${{ steps.version.outputs.version_tag }}"
          docker push "${REGISTRY}/${{ steps.version.outputs.image_namespace }}/luminusos-workstation:${{ steps.version.outputs.branch_tag }}"
          if [ "${{ steps.version.outputs.publish_latest }}" = "true" ]; then
            docker tag \
              "${REGISTRY}/${{ steps.version.outputs.image_namespace }}/luminusos-workstation:${{ steps.version.outputs.version_tag }}" \
              "${REGISTRY}/${{ steps.version.outputs.image_namespace }}/luminusos-workstation:latest"
            docker push "${REGISTRY}/${{ steps.version.outputs.image_namespace }}/luminusos-workstation:latest"
          fi
