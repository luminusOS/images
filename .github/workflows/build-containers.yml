name: Build Containers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FEDORA_VERSION: "44"

jobs:
  build-core:
    name: Build core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/luminusos-core
          tags: |
            type=raw,value=${{ env.FEDORA_VERSION }}.${{ github.run_id }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: editions/core/Containerfile
          build-args: |
            base=quay.io/fedora/fedora-bootc:${{ env.FEDORA_VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-workstation:
    name: Build workstation
    runs-on: ubuntu-latest
    needs: build-core
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/luminusos-workstation
          tags: |
            type=raw,value=${{ env.FEDORA_VERSION }}.${{ github.run_id }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push workstation
        uses: docker/build-push-action@v5
        with:
          context: .
          file: editions/workstation/Containerfile
          build-args: |
            core_image=${{ env.REGISTRY }}/${{ github.repository_owner }}/luminusos-core:latest
            desktop=gnome
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-mobile:
    name: Build mobile (${{ matrix.mobile_desktop }})
    runs-on: ubuntu-latest
    needs: build-core
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        mobile_desktop: [phosh, gnome-mobile]

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/luminusos-mobile-${{ matrix.mobile_desktop }}
          tags: |
            type=raw,value=${{ env.FEDORA_VERSION }}.${{ github.run_id }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push mobile-${{ matrix.mobile_desktop }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: editions/mobile/Containerfile
          build-args: |
            core_image=${{ env.REGISTRY }}/${{ github.repository_owner }}/luminusos-core:latest
            mobile_desktop=${{ matrix.mobile_desktop }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
