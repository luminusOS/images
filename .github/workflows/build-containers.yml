name: Build Containers

on:
  push:
    branches: ["main", "f*"]
  pull_request:
    branches: ["main", "f*"]
  workflow_dispatch:
    inputs:
      fedora_version:
        description: "Fedora version to build"
        required: false
        default: ""
      publish:
        description: "Push signed testing containers to GHCR (no ISO/qcow2)"
        type: boolean
        default: false

concurrency:
  group: build-containers-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-containers:
    name: Build core and workstation
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/containers.yml
    with:
      fedora_version: ${{ inputs.fedora_version || '' }}
      builder_mode: local
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
      channel_policy: auto
    secrets: inherit
