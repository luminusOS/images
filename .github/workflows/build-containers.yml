name: Image Build Validation

on:
  push:
    branches: ["main", "f*"]
  pull_request:
    branches: ["main", "f*"]
  workflow_dispatch:
    inputs:
      fedora_version:
        description: "Fedora version to build (validation only, nothing is published)"
        required: false
        default: ""
      build_installer:
        description: "Build the installer image (validation only, nothing is published)"
        type: boolean
        required: false
        default: false

concurrency:
  group: build-containers-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-containers:
    name: Validate image builds
    permissions:
      contents: read
      packages: read
      actions: read
    uses: ./.github/workflows/containers.yml
    with:
      fedora_version: ${{ inputs.fedora_version || '' }}
      builder_mode: local
      publish: false
      build_installer: ${{ github.event_name == 'workflow_dispatch' && inputs.build_installer == true }}
