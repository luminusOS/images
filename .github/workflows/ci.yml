name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to validate instead of the triggering commit
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-image:
    name: CI image
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.image.outputs.name }}
      fedora_version: ${{ steps.image.outputs.fedora_version }}
      fedora_bootc_digest: ${{ steps.image.outputs.fedora_bootc_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve CI image
        id: image
        run: |
          IMAGE="$(bash tools/ci-image-name.sh)"
          fedora_version="$(tools/config-value.sh DEFAULT_FEDORA_VERSION)"
          fedora_bootc_digest="$(tools/fedora-bootc-digest.sh "${fedora_version}")"
          {
            echo "name=$IMAGE"
            echo "fedora_version=${fedora_version}"
            echo "fedora_bootc_digest=${fedora_bootc_digest}"
          } >> "$GITHUB_OUTPUT"

          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.image.outputs.exists != 'true'

      - name: Build and publish CI image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/Containerfile
          push: true
          build-args: fedora_version=${{ steps.image.outputs.fedora_version }}
          tags: |
            ${{ steps.image.outputs.name }}
            ghcr.io/luminusos/images-ci:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    name: Validate
    runs-on: ubuntu-latest
    needs: [ci-image]
    container:
      image: ${{ needs.ci-image.outputs.name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Check lint tooling
        run: just check

      - name: Lint shell scripts
        run: just lint

      - name: Check shell formatting
        run: find editions shared tools tests .github/scripts -name '*.sh' -print0 | xargs -0 shfmt -d -i 2 -ci

  tests:
    name: Unit & config tests
    runs-on: ubuntu-latest
    needs: [ci-image]
    container:
      image: ${{ needs.ci-image.outputs.name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Run test suite
        run: just test

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -color

  build:
    name: Build core (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ci-image, lint, tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Exercises the Containerfile and the shared/scripts helpers in a
      # real build; the image is discarded (nothing is pushed from CI).
      - name: Build core
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: editions/core/Containerfile
          push: false
          build-args: |
            base=quay.io/fedora/fedora-bootc:${{ needs.ci-image.outputs.fedora_version }}@${{ needs.ci-image.outputs.fedora_bootc_digest }}
            fedora_version=${{ needs.ci-image.outputs.fedora_version }}
            distro_version=${{ needs.ci-image.outputs.fedora_version }}.ci
            distro_name=LuminusOS
            distro_pretty_name=Luminus OS
          tags: localhost/luminusos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
