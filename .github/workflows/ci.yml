name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to validate instead of the triggering commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Diagnose Ubuntu package access
        run: python3 .github/scripts/workflow/apt_diagnostics.py

      - name: Install system tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bats jq shellcheck shfmt

      - name: Install just
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --output just.tar.gz https://github.com/casey/just/releases/download/1.46.0/just-1.46.0-x86_64-unknown-linux-musl.tar.gz
          echo '79966e6e353f535ee7d1c6221641bcc8e3381c55b0d0a6dc6e54b34f9db36eaa  just.tar.gz' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/just-bin"
          tar -xzf just.tar.gz -C "$RUNNER_TEMP/just-bin" just
          echo "$RUNNER_TEMP/just-bin" >> "$GITHUB_PATH"

      - name: Install pinned Python tooling
        run: python -m pip install --disable-pip-version-check ruff==0.16.2 PyYAML==6.0.3 jsonschema==4.26.0

      - name: Check tooling
        run: just check

      - name: Lint and format checks
        run: just lint

      - name: Run tests
        run: just test

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: actionlint
        timeout-minutes: 10
        run: |
          docker build --platform linux/amd64 --file .github/containers/actionlint/Containerfile \
            --tag luminus-actionlint:native26 .github/containers/actionlint
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/work,readonly --workdir /work \
            luminus-actionlint:native26 -color -shellcheck=/usr/local/bin/shellcheck -pyflakes=/usr/bin/pyflakes
