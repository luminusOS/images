name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:44
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: dnf -y install ShellCheck shfmt just jq python3 findutils

      - name: shellcheck
        run: find editions shared tools tests .github/scripts -name '*.sh' -print0 | xargs -0 shellcheck -S warning

      - name: shfmt
        run: find editions shared tools tests .github/scripts -name '*.sh' -print0 | xargs -0 shfmt -d -i 2 -ci

      - name: Test suite
        run: tests/run.sh

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  build-core:
    name: Build core (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Exercises the Containerfile and the shared/scripts helpers in a
      # real build; the image is discarded (nothing is pushed from CI).
      - name: Build core
        uses: docker/build-push-action@v7
        with:
          context: .
          file: editions/core/Containerfile
          push: false
          build-args: |
            base=quay.io/fedora/fedora-bootc:44
            fedora_version=44
            distro_version=44.ci
            distro_name=LuminusOS
            distro_pretty_name=Luminus OS
          tags: localhost/luminusos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
