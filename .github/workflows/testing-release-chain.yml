name: Testing Release Chain

on:
  workflow_run:
    workflows: [Auto Testing]
    types: [completed]

permissions:
  contents: read

# Chains for different candidates may overlap: an older one steps aside once a
# newer candidate exists, and publish.yml serializes the public writes. A shared
# group would let a later run without a candidate replace a pending one.
concurrency:
  group: testing-release-chain-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  advance:
    name: Validate and publish the testing candidate
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.5.3
      - name: Validate, then resume publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/workflow/release_chain.py
