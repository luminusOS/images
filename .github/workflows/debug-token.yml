name: Debug token permissions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Exact replica of the failing command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          printf '# test notes\n' > dist/notes.md
          gh release create "v44.20260721" \
            --title "LuminusOS 44.20260721" \
            --notes-file dist/notes.md \
            --target "69312d6cd77090eb286d7368376426ca8d76f062" \
            && echo "REPLICA_OK" || echo "REPLICA_FAIL"

          echo "== cleanup =="
          gh release delete v44.20260721 --cleanup-tag --yes || true
          gh api repos/${{ github.repository }}/git/refs/tags/v44.20260721 -X DELETE || true
