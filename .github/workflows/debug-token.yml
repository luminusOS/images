name: Debug token permissions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe implicit tag creation via release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== POST /releases with non-existent tag (implicit tag creation) =="
          gh api repos/${{ github.repository }}/releases -X POST \
            -f tag_name=v44.20260721 -f name=probe-implicit \
            -f target_commitish="${{ github.sha }}" \
            && echo "IMPLICIT_OK" || echo "IMPLICIT_FAIL"

          echo "== cleanup =="
          gh release delete v44.20260721 --cleanup-tag --yes || true
          gh api repos/${{ github.repository }}/git/refs/tags/v44.20260721 -X DELETE || true

      - name: Probe explicit ref then release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== create ref explicitly =="
          gh api repos/${{ github.repository }}/git/refs -X POST \
            -f ref=refs/tags/v44.20260721 \
            -f sha="${{ github.sha }}" && echo "REF_OK" || echo "REF_FAIL"

          echo "== POST /releases on existing tag =="
          gh api repos/${{ github.repository }}/releases -X POST \
            -f tag_name=v44.20260721 -f name=probe-explicit \
            && echo "EXPLICIT_OK" || echo "EXPLICIT_FAIL"

          echo "== cleanup =="
          gh release delete v44.20260721 --cleanup-tag --yes || true
          gh api repos/${{ github.repository }}/git/refs/tags/v44.20260721 -X DELETE || true
