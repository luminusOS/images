name: Debug token permissions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Non-head target probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== T4: raw api, target=7fc2af7 (non-head, never released) =="
          gh api repos/${{ github.repository }}/releases -X POST \
            -f tag_name=v44.20260721 -f name=t4 \
            -f target_commitish=7fc2af7 \
            > /dev/null && echo "T4_OK" || echo "T4_FAIL"

          echo "== cleanup =="
          gh release delete v44.20260721 --cleanup-tag --yes 2>/dev/null || true
          gh api repos/${{ github.repository }}/git/refs/tags/v44.20260721 -X DELETE 2>/dev/null || true
