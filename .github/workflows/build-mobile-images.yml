name: Build Mobile Disk Images

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  FEDORA_VERSION: "44"

jobs:
  build-mobile-image:
    name: Build mobile image (${{ matrix.mobile_desktop }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    strategy:
      matrix:
        mobile_desktop: [phosh, gnome-mobile]

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install p7zip
        run: sudo apt-get install -y p7zip-full

      - name: Build raw disk image via bootc-image-builder
        run: |
          mkdir -p output
          IMAGE_REF="${{ env.REGISTRY }}/${{ github.repository_owner }}/luminusos-mobile-${{ matrix.mobile_desktop }}:latest"
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output:/output" \
            -v "$(pwd)/common/bootc-image-builder.toml:/config.toml:ro" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type raw \
            --config /config.toml \
            "${IMAGE_REF}"

      - name: Compress with 7z
        run: |
          FILENAME="luminusos-mobile-${{ matrix.mobile_desktop }}-${{ env.FEDORA_VERSION }}.7z"
          7z a -t7z -m0=lzma2 -mx=9 "${FILENAME}" output/raw/disk.raw
          echo "ARCHIVE=${FILENAME}" >> "$GITHUB_ENV"

      - name: Upload compressed image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: luminusos-mobile-${{ matrix.mobile_desktop }}
          path: ${{ env.ARCHIVE }}
          retention-days: 30

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
