name: Build Workstation ISO

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  FEDORA_VERSION: "44"

jobs:
  build-iso:
    name: Build workstation ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ISO via bootc-image-builder
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ github.repository_owner }}/luminusos-workstation:latest"
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output:/output" \
            -v "$(pwd)/common/bootc-image-builder.toml:/config.toml:ro" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs ext4 \
            --config /config.toml \
            "${IMAGE_REF}"

      - name: Rename ISO
        run: |
          mv output/bootiso/install.iso "luminusos-workstation-${{ env.FEDORA_VERSION }}.iso"

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: luminusos-workstation-iso
          path: luminusos-workstation-${{ env.FEDORA_VERSION }}.iso
          retention-days: 30

      - name: Upload ISO to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: luminusos-workstation-${{ env.FEDORA_VERSION }}.iso
