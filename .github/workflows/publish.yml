name: Publish

"on":
  workflow_dispatch:
    inputs:
      channel:
        description: "testing builds a new release; stable promotes an existing testing build"
        type: choice
        options: [testing, stable]
        default: testing
      promote_version:
        description: "Stable only: testing build to promote, e.g. 45.20260923"
        default: ""
      fedora_version:
        description: "Fedora version (blank uses config/versions.env)"
        default: ""
      sirius_version:
        description: "Sirius release (blank uses config/versions.env)"
        default: ""
      sirius_sha256:
        description: "SHA256 of the Sirius release RPM (required with sirius_version)"
        default: ""
      skip_flatpaks:
        description: "Skip Flatpak preinstall (faster test builds)"
        default: "0"

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  containers:
    name: Build and push containers
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/containers.yml
    with:
      channel: ${{ inputs.channel }}
      promote_version: ${{ inputs.promote_version }}
      fedora_version: ${{ inputs.fedora_version }}
      sirius_version: ${{ inputs.sirius_version }}
      sirius_sha256: ${{ inputs.sirius_sha256 }}
      skip_flatpaks: ${{ inputs.skip_flatpaks }}
      build_installer: true
      publish: true
      builder_mode: registry
    secrets: inherit

  iso:
    name: Package ISO
    needs: [containers]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build ISO from prebuilt containers
        env:
          NAMESPACE: ${{ needs.containers.outputs.image_namespace }}
          VERSION_TAG: ${{ needs.containers.outputs.version_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$PWD:/work" -w /work \
            -e WORKSTATION_ISO_IMAGE="ghcr.io/${NAMESPACE}/luminusos-workstation:${VERSION_TAG}-iso" \
            -e OUTPUT_NAME="luminusos-workstation-${VERSION_TAG}.iso" \
            -e GHCR_USER="${GHCR_USER}" -e GHCR_TOKEN="${GHCR_TOKEN}" \
            "quay.io/fedora/fedora:${{ needs.containers.outputs.fedora_version }}" \
            bash .github/scripts/ci-package.sh iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workstation-iso
          path: luminusos-workstation-*.iso
          compression-level: 0
          if-no-files-found: error

  qcow2:
    name: Package qcow2
    needs: [containers]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build qcow2 from prebuilt containers
        env:
          NAMESPACE: ${{ needs.containers.outputs.image_namespace }}
          VERSION_TAG: ${{ needs.containers.outputs.version_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$PWD:/work" -w /work \
            -e WORKSTATION_IMAGE="ghcr.io/${NAMESPACE}/luminusos-workstation:${VERSION_TAG}" \
            -e OUTPUT_NAME="luminusos-workstation-${VERSION_TAG}.qcow2" \
            -e GHCR_USER="${GHCR_USER}" -e GHCR_TOKEN="${GHCR_TOKEN}" \
            "quay.io/fedora/fedora:${{ needs.containers.outputs.fedora_version }}" \
            bash .github/scripts/ci-package.sh qcow2

      - name: Upload qcow2 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workstation-qcow2
          path: luminusos-workstation-*.qcow2
          compression-level: 0
          if-no-files-found: error

  boot-test:
    name: Boot smoke test
    needs: [containers, iso, qcow2]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf socat tesseract-ocr

      - name: Boot installed system (qcow2)
        run: .github/scripts/boot-test.sh disk dist/luminusos-workstation-*.qcow2 boot-test/disk

      - name: Boot live ISO
        run: .github/scripts/boot-test.sh iso dist/luminusos-workstation-*.iso boot-test/iso

      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-test
          path: boot-test/
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [containers, iso, qcow2, boot-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
          pattern: workstation-*

      - name: Build release notes with checksum table
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          {
            echo "LuminusOS ${{ needs.containers.outputs.version_tag }}"
            echo
            echo "## Workstation"
            echo
            printf "Container: \`%s\`\n" "ghcr.io/${{ needs.containers.outputs.image_namespace }}/luminusos-workstation:${{ needs.containers.outputs.version_tag }}"
            if [ -n "${{ needs.containers.outputs.fedora_bootc_digest }}" ]; then
              echo
              printf "Base: \`%s\`\n" "quay.io/fedora/fedora-bootc:${{ needs.containers.outputs.fedora_version }}@${{ needs.containers.outputs.fedora_bootc_digest }}"
            fi
            echo
            echo "### Downloads (mirrored worldwide by SourceForge)"
            echo
            echo "| File | Size | SHA256 |"
            echo "| --- | --- | --- |"
            for f in luminusos-workstation-*; do
              size="$(du -h "$f" | cut -f1)"
              sha="$(sha256sum "$f" | cut -d' ' -f1)"
              echo "| [${f}](https://sourceforge.net/projects/luminusos/files/${{ needs.containers.outputs.version_tag }}/${f}/download) | ${size} | \`${sha}\` |"
            done
          } > notes.md

      # Full ISO/qcow2 go to SourceForge FRS (mirrored worldwide, no GitHub
      # 2 GiB asset cap); the GitHub release carries notes only.
      - name: Upload artifacts to SourceForge
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 0700 -d ~/.ssh
          install -m 0600 /dev/null ~/.ssh/id_sourceforge
          printf '%s\n' "${SF_SSH_KEY}" > ~/.ssh/id_sourceforge
          ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null
          dest="${SF_USER}@frs.sourceforge.net:/home/frs/project/luminusos/${{ needs.containers.outputs.version_tag }}/"
          rsync -avP --rsh="ssh -i ~/.ssh/id_sourceforge" dist/ "${dest}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--notes-file dist/notes.md --target "$GITHUB_SHA")
          if [ "${{ inputs.channel }}" = stable ]; then
            args+=(--title "LuminusOS ${{ needs.containers.outputs.build_version }}")
          else
            args+=(--title "LuminusOS ${{ needs.containers.outputs.build_version }}: Testing" --prerelease)
          fi
          gh release create "${{ needs.containers.outputs.release_tag }}" "${args[@]}"
