name: Installation Validation

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful release candidate run ID from this branch's release line
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: installation-validation-${{ github.repository }}-${{ inputs.candidate_run_id }}
  cancel-in-progress: false

jobs:
  # osbuild's bubblewrap mounts are denied by the unpriv_bwrap AppArmor
  # profile on ubuntu-26.04, so an image candidate's disposable base disk is
  # built where publish.yml builds its qcow2 and booted by the next job.
  disk:
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    outputs:
      release_kind: ${{ steps.candidate.outputs.release_kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.5
      - name: Fetch and verify candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: python3 .github/scripts/workflow/release_pipeline.py fetch-candidate --repository "$GITHUB_REPOSITORY" --run-id "$CANDIDATE_RUN_ID" --output candidate --public-key shared/release/candidate.pub
      - name: Free disk space
        if: steps.candidate.outputs.release_kind == 'image'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Install published base tools
        if: steps.candidate.outputs.release_kind == 'image'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo qemu-utils
      - name: Re-resolve the published base pinned by the candidate
        id: base
        if: steps.candidate.outputs.release_kind == 'image'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/workflow/validation_base.py --candidate candidate/candidate.json --public-key shared/release/candidate.pub
      - name: Build a disposable disk from the published base
        if: steps.candidate.outputs.release_kind == 'image'
        env:
          WORKSTATION_IMAGE: ${{ steps.base.outputs.workstation_image }}
          FEDORA_VERSION: ${{ steps.base.outputs.fedora_version }}
          DISK_NAME: ${{ steps.base.outputs.disk_name }}
        run: |
          set -euo pipefail
          # The measured base build (run 44462787104) left a 3.92 GiB disk with
          # about 90 GiB free; 40 GiB keeps several times that margin.
          free_gib=$(( $(df --output=avail -k . | tail -1) / 1048576 ))
          if [ "$free_gib" -lt 40 ]; then
            echo "only ${free_gib} GiB free; the base disk build needs at least 40 GiB" >&2
            exit 1
          fi
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$PWD:/work" -w /work \
            -e WORKSTATION_IMAGE="${WORKSTATION_IMAGE}" -e OUTPUT_NAME="${DISK_NAME}" \
            "quay.io/fedora/fedora:${FEDORA_VERSION}" \
            sh -c 'dnf -y install python3 && exec python3 .github/scripts/ci-package.py qcow2'
          sudo chown "$(id -u):$(id -g)" "$DISK_NAME"
          sudo rm -rf .osbuild-cache
          qemu-img info "$DISK_NAME"
      - name: Upload the disposable disk
        if: steps.candidate.outputs.release_kind == 'image'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-validation-base-disk
          path: ${{ steps.base.outputs.disk_name }}
          if-no-files-found: error
          retention-days: 1
      - name: Remove the disposable disk and builder cache
        if: ${{ always() }}
        run: sudo rm -rf .osbuild-cache published-base.qcow2

  installation:
    needs: disk
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    environment: candidate-staging
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Python version
        run: python3 -c 'import sys; sys.exit(sys.version_info < (3, 11))'
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.5
      - name: Fetch and verify candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: python3 .github/scripts/workflow/release_pipeline.py fetch-candidate --repository "$GITHUB_REPOSITORY" --run-id "$CANDIDATE_RUN_ID" --output candidate --public-key shared/release/candidate.pub
      - name: Require the kind the disk job saw
        env:
          RELEASE_KIND: ${{ steps.candidate.outputs.release_kind }}
          DISK_KIND: ${{ needs.disk.outputs.release_kind }}
        run: test -n "$RELEASE_KIND" && test "$RELEASE_KIND" = "$DISK_KIND"
      - name: Enable KVM and vhost-vsock for the runner user
        run: |
          printf '%s\n' \
            'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            'KERNEL=="vhost-vsock", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-luminus-vm.rules
          sudo modprobe vhost_vsock
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm trigger --name-match=vhost-vsock
      - name: Install VM and fixture tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf socat openssh-client skopeo docker-registry
          sudo systemctl disable --now docker-registry.service
          echo '127.0.0.1 registry.validation.test' | sudo tee -a /etc/hosts
      - name: Stage the private workstation image as the update fixture base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="$(python3 -c 'import json; print(json.load(open("candidate/candidate.json"))["images"]["workstation"])')"
          auth="$RUNNER_TEMP/ghcr-auth.json"
          trap 'rm -f "$auth"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$auth" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --preserve-digests --authfile "$auth" "docker://$image" "oci:$RUNNER_TEMP/fixture-base:base"
          chmod -R go-w "$RUNNER_TEMP/fixture-base"
      - name: Stage the candidate index and signature for the upgrade
        if: steps.candidate.outputs.release_kind == 'image'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="$(python3 -c 'import json; print(json.load(open("candidate/candidate.json"))["images"]["workstation"])')"
          mirror="$RUNNER_TEMP/candidate-mirror"
          auth="$(mktemp -d)"
          trap 'rm -rf "$auth"' EXIT
          mkdir -m 700 "$mirror"
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$auth/config.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --all --preserve-digests --authfile "$auth/config.json" "docker://$image" "oci:$mirror/layout:candidate"
          DOCKER_CONFIG="$auth" cosign download signature "$image" > "$mirror/signatures.json"
          chmod -R go-w "$mirror"
      - name: Download the disposable base disk
        if: steps.candidate.outputs.release_kind == 'image'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-validation-base-disk
          path: ${{ runner.temp }}/base-disk
      - name: Run installation and trust validation
        id: validate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          FIXTURE_BASE: ${{ runner.temp }}/fixture-base
        run: python3 .github/scripts/workflow/validation_runner.py
      - name: Remove the staged candidate image
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/fixture-base"
      - name: Remove the base disk, candidate mirror and VM work files
        if: ${{ always() && steps.candidate.outputs.release_kind == 'image' }}
        run: rm -rf "$RUNNER_TEMP/base-disk" "$RUNNER_TEMP/candidate-mirror" "$RUNNER_TEMP/validation-vm"
      - name: Record and sign observed validation
        env:
          RECEIPTS: ${{ steps.validate.outputs.receipts }}
          CANDIDATE_COSIGN_PRIVATE_KEY: ${{ secrets.CANDIDATE_COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.CANDIDATE_COSIGN_PASSWORD }}
        run: python3 .github/scripts/workflow/release_pipeline.py record-validation --candidate candidate/candidate.json --receipts "$RECEIPTS" --output "$RECEIPTS/validation.json" --public-key shared/release/candidate.pub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installation-validation
          path: ${{ steps.validate.outputs.receipts }}/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installation-validation-diagnostics
          path: ${{ runner.temp }}/luminusos-validation-*/
          if-no-files-found: warn
