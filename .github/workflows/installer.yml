name: Installer Image Build

on:
  workflow_call:
    inputs:
      channel: {type: string, required: true}
      fedora_version: {type: string, required: true}
      sirius_version: {type: string, required: true}
      sirius_rpm_version: {type: string, required: true}
      sirius_sha256: {type: string, required: true}
      build_version: {type: string, required: true}
      workstation_image: {type: string, required: true}
      image_namespace: {type: string, required: true}
      target_tag: {type: string, required: true}
      workstation_iso_image: {type: string, required: true}
      workstation_digest: {type: string, default: ""}
      workstation_archive_sha256: {type: string, default: ""}
      workstation_image_id: {type: string, default: ""}
    outputs:
      image_id: {value: '${{ jobs.build.outputs.image_id }}'}
      archive_sha256: {value: '${{ jobs.build.outputs.archive_sha256 }}'}

jobs:
  build:
    name: Build installer image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read, packages: read}
    outputs:
      image_id: '${{ steps.save.outputs.image_id }}'
      archive_sha256: '${{ steps.save.outputs.archive_sha256 }}'
    steps:
      - uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4.7.0
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.channel == 'testing'
        with: {name: workstation-image}
      - name: Load workstation image
        if: inputs.channel == 'testing'
        env:
          IMAGE: '${{ inputs.workstation_image }}'
          ARCHIVE: workstation-image.tar
          ARCHIVE_SHA256: '${{ inputs.workstation_archive_sha256 }}'
          IMAGE_ID: '${{ inputs.workstation_image_id }}'
        run: python3 .github/scripts/workflow/image_archive.py load
      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Export installer payload
        env:
          IMAGE: '${{ inputs.workstation_image }}'
          CHANNEL: '${{ inputs.channel }}'
          WORKSTATION_DIGEST: '${{ inputs.workstation_digest }}'
        run: python3 .github/scripts/workflow/installer_payload.py export
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with: {driver: docker}
      - name: Build workstation ISO live root
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: editions/workstation/Containerfile.installer
          load: true
          push: false
          cache-from: type=gha,scope=installer-${{ inputs.fedora_version }}-${{ runner.arch }}
          cache-to: type=gha,scope=installer-${{ inputs.fedora_version }}-${{ runner.arch }},mode=max
          build-args: |
            fedora_version=${{ inputs.fedora_version }}
            sirius_version=${{ inputs.sirius_version }}
            sirius_rpm_version=${{ inputs.sirius_rpm_version }}
            sirius_sha256=${{ inputs.sirius_sha256 }}
            image_version=${{ inputs.build_version }}
            workstation_image=${{ inputs.workstation_image }}
            workstation_target_image=ghcr.io/${{ inputs.image_namespace }}/luminusos-workstation:${{ inputs.target_tag }}
          tags: '${{ inputs.workstation_iso_image }}'
      - name: Save installer image archive
        id: save
        env:
          IMAGE: '${{ inputs.workstation_iso_image }}'
          ARCHIVE: installer-image.tar
        run: python3 .github/scripts/workflow/image_archive.py save
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: installer-image, path: installer-image.tar, compression-level: 0, if-no-files-found: error}
