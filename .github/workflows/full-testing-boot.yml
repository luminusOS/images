name: Full Testing Boot

on: workflow_dispatch

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository_id == '1118572971' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: write
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      channel: testing
      artifacts: full
      build_sequence: true
      force_core: true
      isolated_feature_candidate: true
    secrets:
      CANDIDATE_COSIGN_PRIVATE_KEY: ${{ secrets.CANDIDATE_COSIGN_PRIVATE_KEY }}
      CANDIDATE_COSIGN_PASSWORD: ${{ secrets.CANDIDATE_COSIGN_PASSWORD }}

  boot:
    needs: prepare
    if: github.repository_id == '1118572971' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: promotion-feature-snapshot-validation
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.5
      - name: Install snapshot and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo jq gnupg qemu-system-x86 qemu-utils ovmf socat openssh-client docker-registry
          sudo systemctl disable --now docker-registry.service
          echo '127.0.0.1 registry.validation.test' | sudo tee -a /etc/hosts
          printf '%s\n' \
            'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            'KERNEL=="vhost-vsock", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-luminus-vm.rules
          sudo modprobe vhost_vsock
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm trigger --name-match=vhost-vsock
      - name: Build the snapshot for the signed candidate index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/workflow/full_testing_boot.py build "$RUNNER_TEMP/full-testing-boot"
      - name: Sign the snapshot for validation only
        env:
          TESTING_FEATURE_OPENPGP_KEY: ${{ secrets.HOSTED_VALIDATION_OPENPGP_KEY }}
          SYSEXT_SIGNING_PASSPHRASE: ${{ secrets.HOSTED_VALIDATION_OPENPGP_PASSPHRASE }}
        run: python3 .github/scripts/workflow/full_testing_boot.py seal "$RUNNER_TEMP/full-testing-boot"
      - name: Stage exact OCI bytes and candidate signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/full-testing-boot"
          image="$(jq -er '.images.workstation' candidate/candidate.json)"
          auth="$(mktemp -d)"
          trap 'rm -rf "$auth"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$auth/config.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          mkdir -m 700 candidate-mirror
          skopeo copy --preserve-digests --authfile "$auth/config.json" "docker://$image" oci:fixture-base:base
          skopeo copy --all --preserve-digests --authfile "$auth/config.json" "docker://$image" oci:candidate-mirror/layout:candidate
          DOCKER_CONFIG="$auth" cosign download signature "$image" > candidate-mirror/signatures.json
      - name: Boot and record validation-only evidence
        run: python3 .github/scripts/workflow/full_testing_boot.py boot "$RUNNER_TEMP/full-testing-boot"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-testing-boot-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-testing-boot/testing-boot-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Report the failed VM phase
        if: failure()
        run: |
          phase="$RUNNER_TEMP/full-testing-boot/receipts/diagnostics/phase.txt"
          if [ -f "$phase" ]; then
            printf 'Last validation phase: '
            head -n 1 "$phase"
          fi
      - name: Remove private snapshot and candidate files
        if: always()
        run: rm -rf "$RUNNER_TEMP/full-testing-boot"
