version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The private core handoff pins a reviewed producer commit; moving it
      # needs its own review, not a weekly bump.
      - dependency-name: "luminusOS/images/*"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
